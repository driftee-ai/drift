# .drift.yaml
# This file defines the rules for checking drift between your code and documentation.

version: 1
provider: gemini
rules:
  - name: Getting Started
    code:
      - cmd/init.go
      - pkg/config/**/*.go
      - pkg/tui/wizard*.go
    docs:
      - docs/content/installation.mdx
      - docs/content/configuration.mdx
  - name: API Reference
    code:
      - main.go
      - cmd/**/*.go
      - pkg/assessor/**/*.go
      - pkg/rules/**/*.go
    docs:
      - docs/content/api/**/*.mdx
  - name: Features & Integrations
    code:
      - pkg/llm/**/*.go
    docs:
      - docs/content/ci-cd.mdx
      - docs/content/providers.mdx
