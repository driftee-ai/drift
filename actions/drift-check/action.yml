name: "Drift Check"
description: "Run drift to check for documentation drift"
author: "driftee-ai"
branding:
  icon: "check-circle"
  color: "green"
inputs:
  config:
    description: "Path to the .drift.yaml config file"
    required: false
    default: ".drift.yaml"
  gemini-api-key:
    description: "API key for the Gemini provider"
    required: false
  openai-api-key:
    description: "API key for the OpenAI provider"
    required: false
  changed-files:
    description: "A comma-separated list of changed files to check"
    required: false
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Drift
      run: |
        set -e
        DRIFT_VERSION="v0.1.1"
        echo "Installing Drift version $DRIFT_VERSION"
        DOWNLOAD_URL="https://github.com/driftee-ai/drift/releases/download/$DRIFT_VERSION/drift_${DRIFT_VERSION}_Linux_x86_64.tar.gz"
        curl -sSL "$DOWNLOAD_URL" -o drift.tar.gz
        tar -xzf drift.tar.gz drift
        sudo install drift /usr/local/bin/
      shell: bash

    - name: Run Drift Check
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
      run: |
        if [ -n "${{ inputs.changed-files }}" ]; then
          drift check --config ${{ inputs.config }} --changed-files "${{ inputs.changed-files }}"
        else
          drift check --config ${{ inputs.config }}
        fi
      shell: bash
