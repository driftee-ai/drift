name: "Missing environment variable"
files:
  - path: src/db.go
    content: |
      package db

      import "os"

      // Connect establishes a connection to the database.
      func Connect() error {
          pass := os.Getenv("DB_PASS")
          if pass == "" {
              panic("DB_PASS is required")
          }
          return nil
      }
  - path: docs/db.md
    content: |
      # Database Connection
      
      Call `Connect()` to establish a connection to the primary database.
expected:
  has_drift: true
  drift_reason_contains: "DB_PASS"
