    content: |
      package client

      import "os"

      // Connect establishes a connection using the API key.
      func Connect() error {
      	key := os.Getenv("API_KEY")
      	if key == "" {
      		return fmt.Errorf("CRITICAL: missing key")
      	}
      	return nil
      }
  - path: docs/client.md
    content: |
      # Client

      ## Connect
      Connects to the server. Returns an error if connection fails.
